<!doctype html>

<html lang="en">
  <head>
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap"
      rel="stylesheet" />
    <link href="styles.css" rel="stylesheet" />
    <title>Trivia!</title>
    <script>
      document.addEventListener('DOMcontentLoaded', function () {
        // CORRECT
        let correct = document.querySelector('.correct')
        correct.addEventListener('click', function () {
          correct.style.backgroundColor = 'green'
          document.querySelector('#response-multiple').innerHTML = 'Correct!'
        })
        // INCORRECT
        let incorrect_answers = document.querySelector('.incorrect')
        for (let i = 0; i < incorrect.length; i++) {
          incorrect_answers[i].addEventListener('click', function () {
            incorrect_answers[i].style.backgroundColor = 'red'
            document.querySelector('#response-multiple').innerHTML =
              'incorrect!'
          })
        }
      })
    </script>
  </head>
  <body>
    <div class="header">
      <h1>Trivia!</h1>
    </div>

    <div class="container">
      <div class="section">
        <h2>Part 1: Multiple Choice</h2>
        <hr />
        <h3>Which player won the 2026 Ballon D'or?</h3>
        <button class="correct">Harry Kane</button>
        <button class="incorrect">Kylian Mbappe</button>
        <button class="incorrect">Lionel Messi</button>
        <button class="incorrect">Lamine Yamal</button>
        <button class="incorrect">Senor Bonson</button>

        <p class="response-multiple"></p>
      </div>

      <div class="section">
        <h2>Part 2: Free Response</h2>
        <hr />
        <h3>In which country did salchipapa originate?</h3>
        <input type="text" />
        <button id="check">Check Answer</button>

        <p id="response-free"></p>
      </div>
    </div>
  </body>
</html>
