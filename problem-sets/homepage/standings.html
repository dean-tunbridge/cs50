<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous" />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"></script>
    <link href="styles.css" rel="stylesheet" />
    <title>Standings</title>
  </head>
  <body>
    <div id="header-loader"></div>
    <main>
      <h1>Standings</h1>
      <section>
        <h3>Full Table</h3>
        <table class="league-table">
          <thread>
            <tr>
              <th></th>
              <th>P</th>
              <th>W-L-D</th>
              <th>G F/A</th>
              <th>Diff +/-</th>
              <th class="col-points">Pts</th>
            </tr>
          </thread>

          <tbody>
            <tr>
              <td class="champions-league"></td>
              <td>1</td>
              <td class="team-name">Bayern Munich</td>
              <td>7</td>
              <td>5-2-0</td>
              <td>25 - 6</td>
              <td class="goal-diff">+19</td>
              <td class="points">17</td>
            </tr>

            <tr>
              <td class="champions-league"></td>
              <td>1</td>
              <td class="team-name">Borussia Dortmund</td>
              <td>7</td>
              <td>5-2-0</td>
              <td>12-4</td>
              <td class="goal-diff">+8</td>
              <td class="points">17</td>
            </tr>

            <tr>
              <td class="champions-league"></td>
              <td>1</td>
              <td class="team-name">Freiburg</td>
              <td>7</td>
              <td>412</td>
              <td>16-9</td>
              <td class="goal-diff">+7</td>
              <td class="points">13</td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>
    <script>
      fetch('header.html')
        .then((response) => response.text())
        .then((data) => {
          document.getElementById('header-loader').innerHTML = data
        })
    </script>
  </body>
</html>
